<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10101b">
<title>ClipMagic AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101b;color:#fff;font-family:Arial,sans-serif;padding:22px}
.container{max-width:520px;margin:auto}
h1{font-size:30px;margin-bottom:6px}
.sub{color:#aaa;margin-bottom:25px}
.card{background:#1c1c2b;padding:20px;border-radius:16px;margin-bottom:16px}
label{display:block;margin:15px 0 8px;font-size:14px;color:#ddd}
input,select,button{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#29293b;color:white;font-size:15px}
input[type=file]{padding:10px}
button{background:#7857ff;border:0;font-weight:bold;margin-top:18px;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#343448}
.small{font-size:12px;color:#aaa;margin-top:8px}
#status{margin-top:16px;white-space:pre-wrap;color:#d7ccff}
a{color:#a994ff}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>✨ ClipMagic AI</h1>
<div class="sub">Turn long videos into short clips automatically.</div>

<div class="card">
<label>Backend connection URL</label>
<input id="backend" placeholder="https://your-backend-url.trycloudflare.com">
<div class="small">Your backend URL is saved on this device.</div>
</div>

<div class="card">
<h3>Choose your video</h3>

<label>Upload a video file</label>
<input id="video" type="file" accept="video/mp4,video/quicktime,video/x-matroska,video/webm">
<div class="small">Supported: MP4, MOV, MKV, WEBM. Maximum 500 MB.</div>

<label>Or paste a video link</label>
<input id="videoUrl" type="url" placeholder="Paste video URL here">

<label>Number of clips</label>
<select id="count">
<option value="2">2 clips</option>
<option value="3" selected>3 clips</option>
<option value="5">5 clips</option>
<option value="10">10 clips</option>
</select>

<label>Clip duration</label>
<select id="duration">
<option value="15">15 seconds</option>
<option value="30" selected>30 seconds</option>
<option value="45">45 seconds</option>
<option value="60">60 seconds</option>
</select>

<button id="generate" onclick="generate()">Generate Clips</button>
<div id="status"></div>
<div id="results"></div>
</div>
</div>

<script>
const backend=document.getElementById("backend");
const statusBox=document.getElementById("status");
const results=document.getElementById("results");
const button=document.getElementById("generate");

backend.value=localStorage.getItem("clipmagic_backend")||"";

backend.addEventListener("change",()=>{
 localStorage.setItem("clipmagic_backend",backend.value.trim().replace(/\/+$/,""));
});

function setStatus(message){statusBox.textContent=message;}

function getBase(){
 const value=backend.value.trim().replace(/\/+$/,"");
 if(!value) throw new Error("Please enter your backend URL first.");
 localStorage.setItem("clipmagic_backend",value);
 return value;
}

async function generate(){
 results.innerHTML="";
 button.disabled=true;

 try{
  const base=getBase();
  const file=document.getElementById("video").files[0];
  const url=document.getElementById("videoUrl").value.trim();
  const count=document.getElementById("count").value;
  const duration=document.getElementById("duration").value;

  let response;

  if(file){
   setStatus("Uploading your video... Please wait.");
   const form=new FormData();
   form.append("file",file);
   form.append("clip_count",count);
   form.append("clip_seconds",duration);

   response=await fetch(base+"/api/upload",{method:"POST",body:form});
  }else if(url){
   setStatus("Submitting your video link...");
   response=await fetch(base+"/api/jobs",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     url:url,
     clip_count:Number(count),
     clip_seconds:Number(duration)
    })
   });
  }else{
   throw new Error("Please upload a video or paste a video link.");
  }

  const data=await response.json();
  if(!response.ok) throw new Error(data.detail||data.error||"Could not submit video.");
  if(!data.job_id) throw new Error("The server did not return a job ID.");

  setStatus("Video submitted successfully. AI is processing it...");
  await pollJob(base,data.job_id);

 }catch(error){
  setStatus("Error: "+error.message);
 }finally{
  button.disabled=false;
 }
}

async function pollJob(base,id){
 for(let i=0;i<360;i++){
  await new Promise(resolve=>setTimeout(resolve,4000));

  const response=await fetch(base+"/api/jobs/"+encodeURIComponent(id));
  const data=await response.json();

  if(!response.ok) throw new Error(data.detail||"Could not check job status.");

  const state=String(data.status||"").toLowerCase();
  setStatus("Status: "+(data.status||"Processing")+
   (data.message?"\n"+data.message:""));

  if(data.error) throw new Error(data.error);

  if(data.clips&&data.clips.length){
   showResults(data.clips,base);
  }

  if(["completed","complete","done","success"].includes(state)){
   if(!data.clips||!data.clips.length){
    showResults(data.outputs||data.results||[],base);
   }
   setStatus("Your clips are ready!");
   return;
  }

  if(["failed","error"].includes(state)){
   throw new Error(data.error||data.message||"Video processing failed.");
  }
 }
 throw new Error("Processing is taking too long. Check your Colab session.");
}

function showResults(clips,base){
 results.innerHTML="<h3>Your clips</h3>";

 clips.forEach((clip,index)=>{
  let url=typeof clip==="string"?clip:(clip.url||clip.download_url||clip.path||"");
  if(!url)return;

  if(!url.startsWith("http")&&!url.startsWith("blob:")){
   url=base+"/"+url.replace(/^\/+/,"");
  }

  const item=document.createElement("div");
  item.className="card";
  item.innerHTML="<strong>Clip "+(index+1)+"</strong><br><br>";
  const link=document.createElement("a");
  link.href=url;
  link.textContent="Download Clip "+(index+1);
  link.target="_blank";
  link.download="";
  item.appendChild(link);
  results.appendChild(item);
 });
}
</script>
</body>
</html>
